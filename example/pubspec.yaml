name: stringcast_example
description: Demo app for the StringCast Flutter SDK.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  stringcast:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Offline fallback shipped in the app (`npx stringcast pull --platform web --path assets/stringcast`).
    - assets/stringcast/
